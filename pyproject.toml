[project]
name = "arcampe"
version = "0.1.0"
description = "ARC-AMPE compliance automation for a fictional state health exchange: checks, POA&M, SSPP export, offline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openpyxl==3.1.5", "pyyaml==6.0.3", "cryptography==50.0.2"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arcampe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]
