# Infrastructure CI. Nothing here touches Azure: fmt, validate, mocked-provider test, tflint and
# bicep build only. There is no deploy workflow; applying the policies is a manual, approved step
# (see docs/implementation-guide.md).
name: infra
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true
env:
  TF_VERSION: "1.16.4"
  TF_IN_AUTOMATION: "1"
  STACK: infra/terraform
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - run: terraform -chdir="$STACK" fmt -check -recursive -diff
      - run: terraform -chdir="$STACK" init -backend=false -input=false
      - run: terraform -chdir="$STACK" validate
      - name: terraform test (offline plan with a mocked provider)
        run: terraform -chdir="$STACK" test

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with: { tflint_version: v0.64.0, github_token: "${{ github.token }}" }
      - working-directory: ${{ env.STACK }}
        run: tflint --init && tflint --recursive --format compact

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bicep build (no Azure login needed)
        run: |
          az bicep install
          az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
